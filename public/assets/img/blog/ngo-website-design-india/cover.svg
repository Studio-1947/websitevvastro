<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">NGO website trust stack diagram</title>
  <desc id="desc">Six layers a nonprofit website's credibility rests on, stacked: governance, impact, people, evidence, contact and security.</desc>
  <rect width="1600" height="1000" fill="#1a1a1a"/>

  <text x="800" y="130" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="28" letter-spacing="2" fill="#e60000">WHAT MAKES A VISITOR TRUST YOU</text>

  <g font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="30" text-anchor="middle">
    <rect x="450" y="180" width="700" height="96" rx="10" fill="#262626" stroke="#3a3a3a" stroke-width="2"/>
    <text x="800" y="236" fill="#f5f5f5">Governance</text>

    <rect x="450" y="288" width="700" height="96" rx="10" fill="#262626" stroke="#3a3a3a" stroke-width="2"/>
    <text x="800" y="344" fill="#f5f5f5">Impact</text>

    <rect x="450" y="396" width="700" height="96" rx="10" fill="#262626" stroke="#3a3a3a" stroke-width="2"/>
    <text x="800" y="452" fill="#f5f5f5">People</text>

    <rect x="450" y="504" width="700" height="96" rx="10" fill="#262626" stroke="#3a3a3a" stroke-width="2"/>
    <text x="800" y="560" fill="#f5f5f5">Evidence</text>

    <rect x="450" y="612" width="700" height="96" rx="10" fill="#262626" stroke="#3a3a3a" stroke-width="2"/>
    <text x="800" y="668" fill="#f5f5f5">Contact</text>

    <rect x="450" y="720" width="700" height="96" rx="10" fill="#e60000" stroke="#e60000" stroke-width="2"/>
    <text x="800" y="776" fill="#ffffff">Security</text>
  </g>

  <text x="800" y="900" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#e5e5e5">Trust is not one feature.</text>
  <text x="800" y="938" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#9a9a9a">It is what a visitor sees when every layer holds.</text>
</svg>
