<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">NGO M&amp;E data pipeline diagram</title>
  <desc id="desc">The pipeline from mobile field data collection through raw data, validation, a clean dataset and a database, to a live dashboard that supports a decision.</desc>
  <rect width="1600" height="1000" fill="#f5f5f5"/>

  <text x="800" y="260" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="30" fill="#454545">A dashboard is only as good as the pipeline behind it.</text>

  <g font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="21" text-anchor="middle">
    <g>
      <rect x="132" y="420" width="165" height="100" rx="10" fill="#ffffff" stroke="#e4e4e4" stroke-width="2"/>
      <text x="214" y="464" fill="#111111">Field</text>
      <text x="214" y="490" font-size="15" font-weight="400" fill="#6b6b6b">collection</text>
    </g>
    <path d="M 297 470 L 327 470" stroke="#b8b8b8" stroke-width="3" marker-end="url(#arrow)"/>

    <g>
      <rect x="327" y="420" width="165" height="100" rx="10" fill="#ffffff" stroke="#e4e4e4" stroke-width="2"/>
      <text x="409" y="464" fill="#111111">Raw Data</text>
      <text x="409" y="490" font-size="15" font-weight="400" fill="#6b6b6b">export</text>
    </g>
    <path d="M 492 470 L 522 470" stroke="#b8b8b8" stroke-width="3" marker-end="url(#arrow)"/>

    <g>
      <rect x="522" y="420" width="165" height="100" rx="10" fill="#ffffff" stroke="#e4e4e4" stroke-width="2"/>
      <text x="604" y="464" fill="#111111">Validation</text>
      <text x="604" y="490" font-size="15" font-weight="400" fill="#6b6b6b">&amp; cleaning</text>
    </g>
    <path d="M 687 470 L 717 470" stroke="#b8b8b8" stroke-width="3" marker-end="url(#arrow)"/>

    <g>
      <rect x="717" y="420" width="165" height="100" rx="10" fill="#ffffff" stroke="#e4e4e4" stroke-width="2"/>
      <text x="799" y="464" fill="#111111">Clean</text>
      <text x="799" y="490" font-size="15" font-weight="400" fill="#6b6b6b">dataset</text>
    </g>
    <path d="M 882 470 L 912 470" stroke="#b8b8b8" stroke-width="3" marker-end="url(#arrow)"/>

    <g>
      <rect x="912" y="420" width="165" height="100" rx="10" fill="#ffffff" stroke="#e4e4e4" stroke-width="2"/>
      <text x="994" y="464" fill="#111111">Database</text>
    </g>
    <path d="M 1077 470 L 1107 470" stroke="#b8b8b8" stroke-width="3" marker-end="url(#arrow)"/>

    <g>
      <rect x="1107" y="420" width="165" height="100" rx="10" fill="#ffffff" stroke="#e4e4e4" stroke-width="2"/>
      <text x="1189" y="464" fill="#111111">Dashboard</text>
    </g>
    <path d="M 1272 470 L 1302 470" stroke="#b8b8b8" stroke-width="3" marker-end="url(#arrow)"/>

    <g>
      <rect x="1302" y="420" width="166" height="100" rx="10" fill="#e60000" stroke="#e60000" stroke-width="2"/>
      <text x="1385" y="470" fill="#ffffff">Decision</text>
    </g>
  </g>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#b8b8b8"/>
    </marker>
  </defs>

  <text x="800" y="620" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#6b6b6b">Skip a step here, and the chart at the end just looks confident. It isn't accurate.</text>
</svg>
