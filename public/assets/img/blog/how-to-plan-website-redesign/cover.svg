<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Website redesign planning diagram</title>
  <desc id="desc">A website interface shown as the visible top layer, resting on six underlying layers it depends on: users, content, technology, accessibility, analytics and organisational goals.</desc>

  <rect width="1600" height="1000" fill="#f5f5f5"/>

  <!-- Browser mockup: the visible layer -->
  <g>
    <rect x="150" y="60" width="1300" height="470" rx="14" fill="#ffffff" stroke="#e4e4e4" stroke-width="2"/>
    <line x1="150" y1="106" x2="1450" y2="106" stroke="#e4e4e4" stroke-width="2"/>
    <circle cx="182" cy="83" r="6" fill="#b8b8b8"/>
    <circle cx="204" cy="83" r="6" fill="#b8b8b8"/>
    <circle cx="226" cy="83" r="6" fill="#b8b8b8"/>

    <!-- nav row -->
    <rect x="190" y="128" width="150" height="16" rx="4" fill="#111111"/>
    <rect x="1120" y="130" width="70" height="12" rx="3" fill="#b8b8b8"/>
    <rect x="1210" y="130" width="70" height="12" rx="3" fill="#b8b8b8"/>
    <rect x="1300" y="130" width="100" height="12" rx="3" fill="#b8b8b8"/>

    <!-- hero block -->
    <rect x="190" y="172" width="1220" height="140" rx="8" fill="#f5f5f5"/>
    <rect x="220" y="208" width="480" height="22" rx="4" fill="#111111"/>
    <rect x="220" y="246" width="360" height="14" rx="4" fill="#b8b8b8"/>
    <rect x="220" y="272" width="130" height="36" rx="18" fill="#e60000"/>

    <!-- three content cards -->
    <g>
      <rect x="190" y="336" width="378" height="164" rx="8" fill="#ffffff" stroke="#e4e4e4" stroke-width="2"/>
      <rect x="216" y="362" width="326" height="70" rx="6" fill="#f5f5f5"/>
      <rect x="216" y="446" width="220" height="12" rx="3" fill="#b8b8b8"/>
      <rect x="216" y="468" width="160" height="12" rx="3" fill="#e4e4e4"/>
    </g>
    <g>
      <rect x="611" y="336" width="378" height="164" rx="8" fill="#ffffff" stroke="#e4e4e4" stroke-width="2"/>
      <rect x="637" y="362" width="326" height="70" rx="6" fill="#f5f5f5"/>
      <rect x="637" y="446" width="220" height="12" rx="3" fill="#b8b8b8"/>
      <rect x="637" y="468" width="160" height="12" rx="3" fill="#e4e4e4"/>
    </g>
    <g>
      <rect x="1032" y="336" width="378" height="164" rx="8" fill="#ffffff" stroke="#e4e4e4" stroke-width="2"/>
      <rect x="1058" y="362" width="326" height="70" rx="6" fill="#f5f5f5"/>
      <rect x="1058" y="446" width="220" height="12" rx="3" fill="#b8b8b8"/>
      <rect x="1058" y="468" width="160" height="12" rx="3" fill="#e4e4e4"/>
    </g>
  </g>

  <!-- Connectors from the visible layer down to what it rests on -->
  <g stroke="#b8b8b8" stroke-width="2" stroke-dasharray="5 6">
    <line x1="290" y1="530" x2="240" y2="612"/>
    <line x1="530" y1="530" x2="490" y2="612"/>
    <line x1="770" y1="530" x2="750" y2="612"/>
    <line x1="990" y1="530" x2="1010" y2="612"/>
    <line x1="1210" y1="530" x2="1260" y2="612"/>
    <line x1="1420" y1="530" x2="1490" y2="612"/>
  </g>

  <!-- Six layers underneath -->
  <g font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="24" text-anchor="middle">
    <g>
      <rect x="150" y="616" width="180" height="52" rx="26" fill="#ffffff" stroke="#e60000" stroke-width="2"/>
      <text x="240" y="650" fill="#111111">Users</text>
    </g>
    <g>
      <rect x="400" y="616" width="180" height="52" rx="26" fill="#ffffff" stroke="#e60000" stroke-width="2"/>
      <text x="490" y="650" fill="#111111">Content</text>
    </g>
    <g>
      <rect x="640" y="616" width="220" height="52" rx="26" fill="#ffffff" stroke="#e60000" stroke-width="2"/>
      <text x="750" y="650" fill="#111111">Technology</text>
    </g>
    <g>
      <rect x="900" y="616" width="220" height="52" rx="26" fill="#ffffff" stroke="#e60000" stroke-width="2"/>
      <text x="1010" y="650" fill="#111111">Accessibility</text>
    </g>
    <g>
      <rect x="1160" y="616" width="200" height="52" rx="26" fill="#ffffff" stroke="#e60000" stroke-width="2"/>
      <text x="1260" y="650" fill="#111111">Analytics</text>
    </g>
    <g>
      <rect x="1400" y="616" width="180" height="52" rx="26" fill="#ffffff" stroke="#e60000" stroke-width="2"/>
      <text x="1490" y="650" fill="#111111">Goals</text>
    </g>
  </g>

  <text x="800" y="760" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#454545">A redesign is not a coat of paint.</text>
  <text x="800" y="802" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#6b6b6b">It rebuilds everything the interface stands on.</text>
</svg>
