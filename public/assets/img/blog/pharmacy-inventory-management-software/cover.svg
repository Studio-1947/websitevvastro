<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Pharmacy inventory cycle diagram</title>
  <desc id="desc">The pharmacy inventory cycle shown as a loop: purchase, batch, shelf, sale, return and expiry, feeding back into purchasing.</desc>
  <rect width="1600" height="1000" fill="#1a1a1a"/>

  <defs>
    <marker id="pharm-arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#808080"/>
    </marker>
  </defs>

  <g stroke="#808080" stroke-width="3" fill="none">
    <line x1="800" y1="248" x2="1004" y2="357" marker-end="url(#pharm-arrow)"/>
    <line x1="1077" y1="405" x2="1077" y2="555" marker-end="url(#pharm-arrow)"/>
    <line x1="1004" y1="603" x2="880" y2="717" marker-end="url(#pharm-arrow)"/>
    <line x1="719" y1="717" x2="597" y2="603" marker-end="url(#pharm-arrow)"/>
    <line x1="523" y1="555" x2="523" y2="405" marker-end="url(#pharm-arrow)"/>
    <line x1="596" y1="357" x2="718" y2="248" marker-end="url(#pharm-arrow)"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="24" text-anchor="middle">
    <circle cx="800" cy="160" r="88" fill="#262626" stroke="#3a3a3a" stroke-width="2"/>
    <text x="800" y="169" fill="#f5f5f5">Purchase</text>

    <circle cx="1077" cy="320" r="88" fill="#262626" stroke="#3a3a3a" stroke-width="2"/>
    <text x="1077" y="329" fill="#f5f5f5">Batch</text>

    <circle cx="1077" cy="640" r="88" fill="#262626" stroke="#3a3a3a" stroke-width="2"/>
    <text x="1077" y="649" fill="#f5f5f5">Shelf</text>

    <circle cx="800" cy="800" r="88" fill="#262626" stroke="#3a3a3a" stroke-width="2"/>
    <text x="800" y="809" fill="#f5f5f5">Sale</text>

    <circle cx="523" cy="640" r="88" fill="#262626" stroke="#3a3a3a" stroke-width="2"/>
    <text x="523" y="649" fill="#f5f5f5">Return</text>

    <circle cx="523" cy="320" r="88" fill="#e60000" stroke="#e60000" stroke-width="2"/>
    <text x="523" y="329" fill="#ffffff">Expiry</text>
  </g>

  <g text-anchor="middle" font-family="Arial, Helvetica, sans-serif">
    <text x="800" y="470" font-size="26" font-weight="700" fill="#e5e5e5">FEFO</text>
    <text x="800" y="500" font-size="17" fill="#9a9a9a">first expiry,</text>
    <text x="800" y="522" font-size="17" fill="#9a9a9a">first out</text>
  </g>
</svg>
