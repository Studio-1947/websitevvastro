<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1067" role="img" aria-labelledby="title desc">
  <title id="title">Hospital patient digital journey diagram</title>
  <desc id="desc">A patient's digital journey to a regional hospital: search, trust, finding the right doctor or department, appointment, visit, and follow-up.</desc>
  <rect width="1600" height="1067" fill="#f5f5f5"/>

  <text x="800" y="300" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="32" fill="#454545">The patient decides before they ever call the front desk.</text>

  <defs>
    <marker id="hosp-arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#b8b8b8"/>
    </marker>
  </defs>

  <g font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="22" text-anchor="middle">
    <g>
      <rect x="0" y="470" width="250" height="110" fill="#ffffff" stroke="#e4e4e4" stroke-width="2"/>
      <text x="125" y="531" fill="#111111">Search</text>
    </g>
    <path d="M 250 525 L 270 525" stroke="#b8b8b8" stroke-width="3" marker-end="url(#hosp-arrow)"/>

    <g>
      <rect x="270" y="470" width="250" height="110" fill="#ffffff" stroke="#e4e4e4" stroke-width="2"/>
      <text x="395" y="531" fill="#111111">Trust</text>
    </g>
    <path d="M 520 525 L 540 525" stroke="#b8b8b8" stroke-width="3" marker-end="url(#hosp-arrow)"/>

    <g>
      <rect x="540" y="470" width="250" height="110" fill="#ffffff" stroke="#e4e4e4" stroke-width="2"/>
      <text x="665" y="519" fill="#111111">Doctor /</text>
      <text x="665" y="546" fill="#111111">department</text>
    </g>
    <path d="M 790 525 L 810 525" stroke="#b8b8b8" stroke-width="3" marker-end="url(#hosp-arrow)"/>

    <g>
      <rect x="810" y="470" width="250" height="110" fill="#ffffff" stroke="#e4e4e4" stroke-width="2"/>
      <text x="935" y="531" fill="#111111">Appointment</text>
    </g>
    <path d="M 1060 525 L 1080 525" stroke="#b8b8b8" stroke-width="3" marker-end="url(#hosp-arrow)"/>

    <g>
      <rect x="1080" y="470" width="250" height="110" fill="#ffffff" stroke="#e4e4e4" stroke-width="2"/>
      <text x="1205" y="531" fill="#111111">Visit</text>
    </g>
    <path d="M 1330 525 L 1350 525" stroke="#b8b8b8" stroke-width="3" marker-end="url(#hosp-arrow)"/>

    <g>
      <rect x="1350" y="470" width="250" height="110" fill="#e60000" stroke="#e60000" stroke-width="2"/>
      <text x="1475" y="531" fill="#ffffff">Follow-up</text>
    </g>
  </g>

  <text x="800" y="700" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#6b6b6b">Every step here can break quietly: a wrong number, an old photo, an unclear department.</text>
</svg>
