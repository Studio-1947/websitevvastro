<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Shared design tokens across three outputs diagram</title>
  <desc id="desc">One shared set of design tokens, a colour, a button style and a text style, reused consistently across a website, an app and a campaign poster.</desc>
  <rect width="1600" height="1000" fill="#f5f5f5"/>

  <text x="800" y="120" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="28" fill="#454545">One set of rules, reused everywhere.</text>

  <g font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="18">
    <rect x="600" y="170" width="60" height="60" rx="10" fill="#e60000"/>
    <rect x="680" y="170" width="150" height="60" rx="30" fill="#111111"/>
    <text x="755" y="207" text-anchor="middle" fill="#ffffff" font-size="18">Button</text>
    <rect x="850" y="180" width="150" height="16" rx="4" fill="#111111"/>
    <text x="925" y="230" text-anchor="middle" font-size="15" font-weight="400" fill="#6b6b6b">Heading style</text>
  </g>
  <line x1="800" y1="250" x2="800" y2="300" stroke="#b8b8b8" stroke-width="2" stroke-dasharray="5 6"/>
  <path d="M 800 300 L 300 380 M 800 300 L 800 380 M 800 300 L 1300 380" stroke="#b8b8b8" stroke-width="2" stroke-dasharray="5 6" fill="none"/>

  <g font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="19" text-anchor="middle">
    <rect x="120" y="380" width="360" height="440" rx="12" fill="#ffffff" stroke="#e4e4e4" stroke-width="2"/>
    <text x="300" y="420" fill="#6b6b6b" font-size="15" font-weight="400">WEBSITE</text>
    <rect x="150" y="440" width="300" height="140" rx="6" fill="#f5f5f5"/>
    <rect x="150" y="600" width="120" height="16" rx="4" fill="#111111"/>
    <rect x="150" y="640" width="110" height="44" rx="22" fill="#e60000"/>

    <rect x="620" y="380" width="360" height="440" rx="12" fill="#ffffff" stroke="#e4e4e4" stroke-width="2"/>
    <text x="800" y="420" fill="#6b6b6b" font-size="15" font-weight="400">APP</text>
    <rect x="650" y="440" width="300" height="200" rx="6" fill="#f5f5f5"/>
    <rect x="650" y="660" width="140" height="16" rx="4" fill="#111111"/>
    <rect x="650" y="700" width="110" height="44" rx="22" fill="#e60000"/>

    <rect x="1120" y="380" width="360" height="440" rx="12" fill="#ffffff" stroke="#e4e4e4" stroke-width="2"/>
    <text x="1300" y="420" fill="#6b6b6b" font-size="15" font-weight="400">CAMPAIGN</text>
    <rect x="1150" y="440" width="300" height="260" rx="6" fill="#f5f5f5"/>
    <rect x="1150" y="720" width="140" height="16" rx="4" fill="#111111"/>
  </g>

  <text x="800" y="900" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#454545">Change the source once, and every output updates.</text>
</svg>
