<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Baseline to endline evaluation diagram</title>
  <desc id="desc">The evaluation sequence from problem and indicators through a baseline survey, the programme itself, an endline survey, and interpretation.</desc>
  <rect width="1600" height="1000" fill="#1a1a1a"/>

  <text x="800" y="260" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="30" fill="#e5e5e5">A comparison only means something if both ends were built the same way.</text>

  <defs>
    <marker id="bl-arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#808080"/>
    </marker>
  </defs>

  <g font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="19" text-anchor="middle">
    <g>
      <rect x="40" y="420" width="220" height="100" rx="10" fill="#262626" stroke="#3a3a3a" stroke-width="2"/>
      <text x="150" y="476" fill="#f5f5f5">Problem</text>
    </g>
    <path d="M 260 470 L 300 470" stroke="#808080" stroke-width="3" marker-end="url(#bl-arrow)"/>

    <g>
      <rect x="300" y="420" width="220" height="100" rx="10" fill="#262626" stroke="#3a3a3a" stroke-width="2"/>
      <text x="410" y="476" fill="#f5f5f5">Indicators</text>
    </g>
    <path d="M 520 470 L 560 470" stroke="#808080" stroke-width="3" marker-end="url(#bl-arrow)"/>

    <g>
      <rect x="560" y="420" width="220" height="100" rx="10" fill="#e60000" stroke="#e60000" stroke-width="2"/>
      <text x="670" y="476" fill="#ffffff">Baseline</text>
    </g>
    <path d="M 780 470 L 820 470" stroke="#808080" stroke-width="3" marker-end="url(#bl-arrow)"/>

    <g>
      <rect x="820" y="420" width="220" height="100" rx="10" fill="#262626" stroke="#3a3a3a" stroke-width="2"/>
      <text x="930" y="476" fill="#f5f5f5">Programme</text>
    </g>
    <path d="M 1040 470 L 1080 470" stroke="#808080" stroke-width="3" marker-end="url(#bl-arrow)"/>

    <g>
      <rect x="1080" y="420" width="220" height="100" rx="10" fill="#e60000" stroke="#e60000" stroke-width="2"/>
      <text x="1190" y="476" fill="#ffffff">Endline</text>
    </g>
    <path d="M 1300 470 L 1340 470" stroke="#808080" stroke-width="3" marker-end="url(#bl-arrow)"/>

    <g>
      <rect x="1340" y="420" width="220" height="100" rx="10" fill="#262626" stroke="#3a3a3a" stroke-width="2"/>
      <text x="1450" y="466" fill="#f5f5f5">Interpre-</text>
      <text x="1450" y="490" fill="#f5f5f5">tation</text>
    </g>
  </g>

  <text x="800" y="640" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#9a9a9a">Same indicators, same methods, same care &#8212; both times.</text>
</svg>
