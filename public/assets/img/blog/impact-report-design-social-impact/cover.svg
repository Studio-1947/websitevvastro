<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Impact report information hierarchy diagram</title>
  <desc id="desc">The path from a finding to evidence, to what it means, to the action a reader should take, shown as four connected stages.</desc>
  <rect width="1600" height="1000" fill="#f5f5f5"/>

  <defs>
    <marker id="ir-arrow" markerWidth="10" markerHeight="10" refX="3" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,0 L3,6 Z" fill="#b8b8b8"/>
    </marker>
  </defs>

  <g font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="30" text-anchor="middle">
    <rect x="550" y="110" width="500" height="120" rx="10" fill="#ffffff" stroke="#e4e4e4" stroke-width="2"/>
    <text x="800" y="178" fill="#111111">Finding</text>
    <path d="M 800 230 L 800 270" stroke="#b8b8b8" stroke-width="3" marker-end="url(#ir-arrow)"/>

    <rect x="550" y="278" width="500" height="120" rx="10" fill="#ffffff" stroke="#e4e4e4" stroke-width="2"/>
    <text x="800" y="346" fill="#111111">Evidence</text>
    <path d="M 800 398 L 800 438" stroke="#b8b8b8" stroke-width="3" marker-end="url(#ir-arrow)"/>

    <rect x="550" y="446" width="500" height="120" rx="10" fill="#ffffff" stroke="#e4e4e4" stroke-width="2"/>
    <text x="800" y="514" fill="#111111">Meaning</text>
    <path d="M 800 566 L 800 606" stroke="#b8b8b8" stroke-width="3" marker-end="url(#ir-arrow)"/>

    <rect x="550" y="614" width="500" height="120" rx="10" fill="#e60000" stroke="#e60000" stroke-width="2"/>
    <text x="800" y="682" fill="#ffffff">Action</text>
  </g>

  <text x="800" y="820" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#454545">A report should make each step visible,</text>
  <text x="800" y="856" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#454545">not jump straight from data to conclusion.</text>
</svg>
