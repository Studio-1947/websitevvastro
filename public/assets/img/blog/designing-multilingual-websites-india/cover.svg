<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Text expansion across Indian languages diagram</title>
  <desc id="desc">The same button label shown in English, Bengali, Hindi and Nepali, each a different width, illustrating how translated text expands.</desc>
  <rect width="1600" height="1000" fill="#f5f5f5"/>

  <text x="800" y="140" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="28" fill="#454545">One button label, four languages, four widths.</text>

  <g font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="26">
    <text x="330" y="286" text-anchor="end" fill="#6b6b6b" font-size="20">EN</text>
    <rect x="360" y="238" width="230" height="70" rx="35" fill="#e60000"/>
    <text x="475" y="284" text-anchor="middle" fill="#ffffff">Contact Us</text>

    <text x="330" y="416" text-anchor="end" fill="#6b6b6b" font-size="20">BN</text>
    <rect x="360" y="368" width="330" height="70" rx="35" fill="#e60000"/>
    <text x="525" y="414" text-anchor="middle" fill="#ffffff" font-family="Noto Sans Bengali, Arial, sans-serif">যোগাযোগ করুন</text>

    <text x="330" y="546" text-anchor="end" fill="#6b6b6b" font-size="20">HI</text>
    <rect x="360" y="498" width="300" height="70" rx="35" fill="#e60000"/>
    <text x="510" y="544" text-anchor="middle" fill="#ffffff" font-family="Noto Sans Devanagari, Arial, sans-serif">संपर्क करें</text>

    <text x="330" y="676" text-anchor="end" fill="#6b6b6b" font-size="20">NE</text>
    <rect x="360" y="628" width="430" height="70" rx="35" fill="#e60000"/>
    <text x="575" y="674" text-anchor="middle" fill="#ffffff" font-family="Noto Sans Devanagari, Arial, sans-serif">सम्पर्क गर्नुहोस्</text>
  </g>

  <line x1="590" y1="230" x2="590" y2="706" stroke="#b8b8b8" stroke-width="2" stroke-dasharray="5 6"/>
  <text x="610" y="230" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#6b6b6b">shortest fits here</text>

  <text x="800" y="820" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#454545">A component built for the shortest label</text>
  <text x="800" y="856" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#454545">breaks the moment a longer one arrives.</text>
</svg>
