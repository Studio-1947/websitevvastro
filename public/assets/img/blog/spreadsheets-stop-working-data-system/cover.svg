<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">From spreadsheet to data system diagram</title>
  <desc id="desc">The path from a single spreadsheet to structured data, a proper database, and reports several people can trust at once.</desc>
  <rect width="1600" height="1000" fill="#f5f5f5"/>

  <text x="800" y="260" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="30" fill="#454545">One spreadsheet works, until three people edit it at once.</text>

  <defs>
    <marker id="ss-arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#b8b8b8"/>
    </marker>
  </defs>

  <g font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="20" text-anchor="middle">
    <g>
      <rect x="80" y="420" width="280" height="100" rx="10" fill="#ffffff" stroke="#e4e4e4" stroke-width="2"/>
      <text x="220" y="476" fill="#111111">Spreadsheet</text>
    </g>
    <path d="M 360 470 L 400 470" stroke="#b8b8b8" stroke-width="3" marker-end="url(#ss-arrow)"/>

    <g>
      <rect x="400" y="420" width="280" height="100" rx="10" fill="#ffffff" stroke="#e4e4e4" stroke-width="2"/>
      <text x="540" y="466" fill="#111111">Structured</text>
      <text x="540" y="492" fill="#111111">data</text>
    </g>
    <path d="M 680 470 L 720 470" stroke="#b8b8b8" stroke-width="3" marker-end="url(#ss-arrow)"/>

    <g>
      <rect x="720" y="420" width="280" height="100" rx="10" fill="#e60000" stroke="#e60000" stroke-width="2"/>
      <text x="860" y="476" fill="#ffffff">Database</text>
    </g>
    <path d="M 1000 470 L 1040 470" stroke="#b8b8b8" stroke-width="3" marker-end="url(#ss-arrow)"/>

    <g>
      <rect x="1040" y="420" width="280" height="100" rx="10" fill="#ffffff" stroke="#e4e4e4" stroke-width="2"/>
      <text x="1180" y="466" fill="#111111">Reports &amp;</text>
      <text x="1180" y="492" fill="#111111">dashboards</text>
    </g>
  </g>

  <text x="800" y="640" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#6b6b6b">The database is the part that lets everyone trust the same number.</text>
</svg>
