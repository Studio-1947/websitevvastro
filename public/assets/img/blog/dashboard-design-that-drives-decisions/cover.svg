<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">What to show and what to hide on a dashboard diagram</title>
  <desc id="desc">A two-column comparison of what belongs on a decision-making dashboard and what is decorative noise that should be left off.</desc>
  <rect width="1600" height="1000" fill="#f5f5f5"/>

  <text x="800" y="140" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="28" fill="#454545">A dashboard should change a decision, not decorate a screen.</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="120" y="200" width="640" height="560" rx="14" fill="#ffffff" stroke="#e60000" stroke-width="2"/>
    <text x="440" y="260" text-anchor="middle" font-weight="700" font-size="26" fill="#e60000">Show</text>
    <g font-size="20" fill="#111111">
      <text x="160" y="330">&#8226; Target versus actual</text>
      <text x="160" y="380">&#8226; Trend over time</text>
      <text x="160" y="430">&#8226; Where something needs attention</text>
      <text x="160" y="480">&#8226; Date of last refresh</text>
      <text x="160" y="530">&#8226; A comparison the reader can act on</text>
    </g>

    <rect x="840" y="200" width="640" height="560" rx="14" fill="#ffffff" stroke="#b8b8b8" stroke-width="2"/>
    <text x="1160" y="260" text-anchor="middle" font-weight="700" font-size="26" fill="#454545">Hide</text>
    <g font-size="20" fill="#111111">
      <text x="880" y="330">&#8226; Every field just because it exists</text>
      <text x="880" y="380">&#8226; A chart nobody has asked to see</text>
      <text x="880" y="430">&#8226; Decoration with no comparison</text>
      <text x="880" y="480">&#8226; Numbers with no context</text>
      <text x="880" y="530">&#8226; Raw participant-level detail</text>
    </g>
  </g>

  <text x="800" y="880" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#454545">Five useful indicators beat fifteen pages of charts.</text>
</svg>
