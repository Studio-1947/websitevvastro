<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">What analytics tells you versus what interviews tell you diagram</title>
  <desc id="desc">A two-column comparison: analytics shows what happened and where people dropped off; interviews explain why, in the user's own words.</desc>
  <rect width="1600" height="1000" fill="#f5f5f5"/>

  <text x="800" y="140" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="28" fill="#454545">Analytics shows where. Interviews explain why.</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="120" y="200" width="640" height="560" rx="14" fill="#ffffff" stroke="#b8b8b8" stroke-width="2"/>
    <text x="440" y="260" text-anchor="middle" font-weight="700" font-size="24" fill="#454545">Analytics tells you</text>
    <g font-size="19" fill="#111111">
      <text x="160" y="330">&#8226; Where people dropped off</text>
      <text x="160" y="380">&#8226; Which page they left from</text>
      <text x="160" y="430">&#8226; How many did not finish</text>
      <text x="160" y="480">&#8226; What device they used</text>
      <text x="160" y="530">&#8226; That something is wrong</text>
    </g>

    <rect x="840" y="200" width="640" height="560" rx="14" fill="#ffffff" stroke="#e60000" stroke-width="2"/>
    <text x="1160" y="260" text-anchor="middle" font-weight="700" font-size="24" fill="#e60000">Interviews tell you</text>
    <g font-size="19" fill="#111111">
      <text x="880" y="330">&#8226; What confused them there</text>
      <text x="880" y="380">&#8226; What they expected instead</text>
      <text x="880" y="430">&#8226; What almost made them leave</text>
      <text x="880" y="480">&#8226; The words they'd actually use</text>
      <text x="880" y="530">&#8226; Why it is wrong</text>
    </g>
  </g>

  <text x="800" y="880" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#454545">You need both to fix it, not guess at it.</text>
</svg>
