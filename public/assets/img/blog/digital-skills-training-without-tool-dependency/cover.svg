<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Training to independence progression diagram</title>
  <desc id="desc">A four-stage progression from training through guided practice and support to a team working independently, without depending on the trainer.</desc>
  <rect width="1600" height="1000" fill="#f5f5f5"/>

  <text x="800" y="260" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="30" fill="#454545">The goal is a team that no longer needs you in the room.</text>

  <defs>
    <marker id="ds-arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#b8b8b8"/>
    </marker>
  </defs>

  <g font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="20" text-anchor="middle">
    <g>
      <rect x="80" y="420" width="320" height="100" rx="10" fill="#ffffff" stroke="#e4e4e4" stroke-width="2"/>
      <text x="240" y="476" fill="#111111">Train</text>
    </g>
    <path d="M 400 470 L 440 470" stroke="#b8b8b8" stroke-width="3" marker-end="url(#ds-arrow)"/>

    <g>
      <rect x="440" y="420" width="320" height="100" rx="10" fill="#ffffff" stroke="#e4e4e4" stroke-width="2"/>
      <text x="600" y="476" fill="#111111">Practice</text>
    </g>
    <path d="M 760 470 L 800 470" stroke="#b8b8b8" stroke-width="3" marker-end="url(#ds-arrow)"/>

    <g>
      <rect x="800" y="420" width="320" height="100" rx="10" fill="#ffffff" stroke="#e4e4e4" stroke-width="2"/>
      <text x="960" y="476" fill="#111111">Support</text>
    </g>
    <path d="M 1120 470 L 1160 470" stroke="#b8b8b8" stroke-width="3" marker-end="url(#ds-arrow)"/>

    <g>
      <rect x="1160" y="420" width="360" height="100" rx="10" fill="#e60000" stroke="#e60000" stroke-width="2"/>
      <text x="1340" y="466" fill="#ffffff">Independent</text>
    </g>
  </g>

  <text x="800" y="640" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#6b6b6b">Skip straight from training to independent, and the tool becomes the trainer's crutch, not the team's.</text>
</svg>
