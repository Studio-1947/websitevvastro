<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Listen, understand, decide diagram</title>
  <desc id="desc">A three-stage sequence: listen to what people are already saying, understand what it means, then decide what to launch.</desc>
  <rect width="1600" height="1000" fill="#f5f5f5"/>

  <text x="800" y="280" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="30" fill="#454545">People are already talking. Are you listening first?</text>

  <defs>
    <marker id="sl-arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#b8b8b8"/>
    </marker>
  </defs>

  <g font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="26" text-anchor="middle">
    <rect x="180" y="420" width="360" height="140" rx="12" fill="#ffffff" stroke="#e4e4e4" stroke-width="2"/>
    <text x="360" y="498" fill="#111111">Listen</text>
    <path d="M 540 490 L 610 490" stroke="#b8b8b8" stroke-width="3" marker-end="url(#sl-arrow)"/>

    <rect x="620" y="420" width="360" height="140" rx="12" fill="#ffffff" stroke="#e4e4e4" stroke-width="2"/>
    <text x="800" y="498" fill="#111111">Understand</text>
    <path d="M 980 490 L 1050 490" stroke="#b8b8b8" stroke-width="3" marker-end="url(#sl-arrow)"/>

    <rect x="1060" y="420" width="360" height="140" rx="12" fill="#e60000" stroke="#e60000" stroke-width="2"/>
    <text x="1240" y="498" fill="#ffffff">Decide</text>
  </g>

  <text x="800" y="660" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#6b6b6b">Skip straight to launch, and you find out what people think after it's too late to change course.</text>
</svg>
