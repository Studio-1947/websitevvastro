<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="A ring of people gathered around a shared table with an idea at its centre, representing Community Workshops">
  <title>Community Workshops</title>
  <rect width="1600" height="1000" fill="#F4E9D8" />

  <!-- sun -->
  <circle cx="290" cy="200" r="130" fill="#FFB703" />

  <!-- scattered dots -->
  <g fill="#1B1D24" opacity=".5">
    <circle cx="1420" cy="150" r="4" />
    <circle cx="1360" cy="260" r="3" />
    <circle cx="1480" cy="280" r="4.5" />
    <circle cx="120" cy="420" r="3.5" />
    <circle cx="80" cy="520" r="4" />
    <circle cx="1500" cy="600" r="4" />
    <circle cx="1440" cy="700" r="3" />
  </g>

  <!-- ground shadow -->
  <ellipse cx="800" cy="820" rx="420" ry="46" fill="#1B1D24" opacity=".12" />

  <!-- shared table -->
  <circle cx="800" cy="560" r="230" fill="#1B1D24" />
  <ellipse cx="800" cy="480" rx="230" ry="60" fill="#292C36" />
  <ellipse cx="800" cy="470" rx="170" ry="42" fill="#33374400" stroke="#F4E9D8" stroke-width="3" opacity=".2" />

  <!-- idea at centre -->
  <g transform="translate(800,470)">
    <circle r="70" fill="#FFB703" />
    <path d="M-18,10 a18,18 0 1 1 36,0 c0,12 -10,16 -10,28 h-16 c0,-12 -10,-16 -10,-28 Z" fill="#1B1D24" />
    <rect x="-10" y="40" width="20" height="8" rx="4" fill="#1B1D24" />
    <g stroke="#1B1D24" stroke-width="5" stroke-linecap="round" opacity=".7">
      <line x1="0" y1="-58" x2="0" y2="-76" />
      <line x1="41" y1="-41" x2="54" y2="-54" />
      <line x1="-41" y1="-41" x2="-54" y2="-54" />
      <line x1="58" y1="0" x2="76" y2="0" />
      <line x1="-58" y1="0" x2="-76" y2="0" />
    </g>
  </g>

  <!-- people, ringed around the table -->
  <g id="people">
    <!-- top -->
    <g transform="translate(800,230)">
      <path d="M-70,120 C-70,55 -38,10 0,10 C38,10 70,55 70,120 Z" fill="#E60000" />
      <circle cy="-16" r="48" fill="#E60000" />
    </g>
    <!-- upper right -->
    <g transform="translate(1080,340)">
      <path d="M-65,112 C-65,50 -35,8 0,8 C35,8 65,50 65,112 Z" fill="#FF6B35" />
      <circle cy="-16" r="45" fill="#FF6B35" />
    </g>
    <!-- lower right -->
    <g transform="translate(1000,700)">
      <path d="M-65,112 C-65,50 -35,8 0,8 C35,8 65,50 65,112 Z" fill="#2B4C7E" />
      <circle cy="-16" r="45" fill="#2B4C7E" />
    </g>
    <!-- lower left -->
    <g transform="translate(600,700)">
      <path d="M-65,112 C-65,50 -35,8 0,8 C35,8 65,50 65,112 Z" fill="#FFB703" />
      <circle cy="-16" r="45" fill="#FFB703" />
    </g>
    <!-- upper left -->
    <g transform="translate(520,340)">
      <path d="M-65,112 C-65,50 -35,8 0,8 C35,8 65,50 65,112 Z" fill="#1B1D24" />
      <circle cy="-16" r="45" fill="#1B1D24" />
    </g>
  </g>
</svg>
