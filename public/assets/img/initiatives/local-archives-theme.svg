<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Layered hill silhouette with an open archive folder, representing Local Archives">
  <title>Local Archives</title>
  <rect width="1600" height="1000" fill="#F4E9D8" />

  <!-- sun -->
  <circle cx="1310" cy="210" r="150" fill="#FFB703" />
  <circle cx="1310" cy="210" r="150" fill="none" stroke="#F4E9D8" stroke-width="2" opacity=".3" />

  <!-- scattered dots, top field -->
  <g fill="#1B1D24" opacity=".55">
    <circle cx="140" cy="150" r="5" />
    <circle cx="230" cy="260" r="3.5" />
    <circle cx="90" cy="320" r="4" />
    <circle cx="1020" cy="120" r="4" />
    <circle cx="960" cy="190" r="3" />
    <circle cx="600" cy="90" r="4.5" />
    <circle cx="700" cy="180" r="3" />
  </g>

  <!-- back hill: navy -->
  <path d="M0,1000 L0,660 L330,400 L620,560 L900,380 L1220,600 L1600,430 L1600,1000 Z" fill="#1B1D24" />
  <g fill="#F4E9D8" opacity=".5">
    <circle cx="260" cy="520" r="4" />
    <circle cx="480" cy="470" r="3" />
    <circle cx="760" cy="440" r="4" />
    <circle cx="1080" cy="500" r="3.5" />
    <circle cx="1360" cy="470" r="4" />
  </g>

  <!-- mid hill: red -->
  <path d="M0,1000 L0,800 L260,600 L560,760 L860,580 L1180,780 L1600,620 L1600,1000 Z" fill="#E60000" />

  <!-- front hill: orange -->
  <path d="M0,1000 L0,900 L300,760 L640,880 L980,720 L1320,890 L1600,800 L1600,1000 Z" fill="#FF6B35" />
  <g fill="#F4E9D8" opacity=".5">
    <circle cx="420" cy="850" r="4" />
    <circle cx="760" cy="820" r="3" />
    <circle cx="1140" cy="840" r="4" />
  </g>

  <!-- archive / open folder, resting on the front hill -->
  <g transform="translate(800,700)">
    <ellipse cx="0" cy="185" rx="230" ry="26" fill="#1B1D24" opacity=".18" />
    <!-- back cover -->
    <path d="M-210,150 L-230,-40 C-230,-58 -216,-72 -198,-72 L-20,-72 C-8,-72 4,-66 12,-56 L34,-28 L198,-28 C216,-28 230,-14 230,4 L210,150 Z" fill="#FFFFFF" />
    <!-- ruled lines suggesting documented pages -->
    <g stroke="#1B1D24" stroke-width="6" stroke-linecap="round" opacity=".35">
      <line x1="-150" y1="10" x2="120" y2="10" />
      <line x1="-150" y1="42" x2="150" y2="42" />
      <line x1="-150" y1="74" x2="90" y2="74" />
    </g>
    <!-- front flap -->
    <path d="M-210,150 L-186,60 C-182,44 -168,32 -150,32 L150,32 C168,32 182,44 186,60 L210,150 Z" fill="#FFB703" />
    <!-- stamp -->
    <circle cx="150" cy="-40" r="34" fill="#E60000" />
    <path d="M136,-40 l10,10 l20,-24" fill="none" stroke="#F4E9D8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- thread + needle craft accent -->
  <g transform="translate(220,880)" stroke="#1B1D24" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M0,0 C40,-30 80,20 120,-10 C150,-32 170,-6 190,-18" opacity=".6" />
    <circle cx="0" cy="0" r="7" fill="#1B1D24" stroke="none" />
  </g>
</svg>
